[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neocaffeine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.12.0.1,<1",
    "ruamel.yaml>=0.19.1,<1",
    "pint>=0.26.2,<1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["neocaffeine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
